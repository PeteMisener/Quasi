name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - {os: macos-latest, python: '3.10'}
          - {os: macos-latest, python: '3.11'}
          - {os: macos-latest, python: '3.13'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.10'}
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.13'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install and run test suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,validation]" pytest pytest-cov tomli
          python -m pytest -q --disable-warnings
      - name: Verify installed real-data numerical reference suite is not skipped
        run: python -m pytest tests/parity/test_reference_gate.py tests/validation/test_reference_integrity.py -q
      - name: Execute walkthrough with noninteractive plotting
        env:
          MPLBACKEND: Agg
        run: python examples/walkthrough.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tooling
        run: python -m pip install -e ".[dev,all,docs]"
      - name: Ruff lint gate
        run: ruff check src tests
      - name: Compile check
        run: python -m compileall -q src tests validation examples
      - name: Mypy type check
        run: mypy --ignore-missing-imports src/quasi
      - name: Fail-closed v1.0 readiness inventory (informational; not approval)
        run: python -m validation.release_readiness --output validation/reports/v1_release_readiness.json
      - name: Coverage report
        run: python -m pytest -q --cov=quasi --cov-report=term-missing
      - name: Documentation build
        run: mkdocs build --strict
      - name: Dependency vulnerability scan
        run: pip-audit --local --skip-editable

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source and binary distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-check clean wheel and sdist installs (core runtime only)
        shell: bash
        run: |
          python -m venv /tmp/quasi-wheel
          /tmp/quasi-wheel/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/quasi-wheel/bin/python -c 'import quasi; from importlib.metadata import version; assert quasi.__version__ == version("quasi-qed")')
          python -m venv /tmp/quasi-sdist
          /tmp/quasi-sdist/bin/python -m pip install dist/*.tar.gz
          (cd /tmp && /tmp/quasi-sdist/bin/python -c 'import quasi; from importlib.metadata import version; assert quasi.__version__ == version("quasi-qed")')
      - uses: actions/upload-artifact@v4
        with:
          name: quasi-development-distributions
          path: dist/*
          retention-days: 14
