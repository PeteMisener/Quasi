[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quasi-qed"
version = "0.2.0.dev0"
description = "Quasi: experimental Python estimators for quasi-experimental research designs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quasi contributors" }]
keywords = ["quasi-experimental", "causal-inference", "econometrics", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
report = ["rich>=13"]
ai = [] # adapters use Python standard-library HTTP clients (not bundled paid clients)
polars = ["polars>=0.20", "pyarrow>=14"]
ml = ["scikit-learn>=1.3"]
all = ["matplotlib>=3.7", "rich>=13", "polars>=0.20", "pyarrow>=14"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
validation = ["statsmodels>=0.14.6,<0.16"]
rdrobust = ["rdrobust"] # External selector / reference backend; not required for Quasi core
dev = [
    "pytest>=8", "pytest-cov>=6", "hypothesis>=6.100", "ruff>=0.9", "mypy>=1.13",
    "build>=1.2", "twine>=5", "pip-audit>=2.7", "mkdocs>=1.6",
    "tomli>=2; python_version < '3.11'",
    "statsmodels>=0.14.6,<0.16",
]

[tool.setuptools.package-data]
quasi = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quasi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "synthetic: compatibility regressions, not reference parity",
    "parity: requires authenticated independent external reference fixtures",
    "slow: expensive Monte Carlo validation",
]

[tool.coverage.run]
source = ["quasi"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Conservative ratchet for legacy sources: syntax, imports and undefined names.
select = ["E7", "E9", "F821", "F822", "F823"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
